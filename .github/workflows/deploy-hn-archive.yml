name: Deploy HN archive

on:
  push:
    branches: [main]
    paths:
      - 'content/digests/hn/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Current main ref to deploy (defaults to main)'
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: drose-hn-archive-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out deployment target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Resolve and validate target commit
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          echo "superseded=false" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == push ]]; then
            sha="$EVENT_SHA"
            before="$EVENT_BEFORE"
            if [[ ! "$before" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              echo "cannot determine the pushed commit range" >&2
              exit 1
            fi
            paths="$(git diff --name-only "$before" "$sha")"
            [[ -n "$paths" ]] || { echo "push has no changed paths" >&2; exit 1; }
            while IFS= read -r path; do
              case "$path" in
                content/digests/hn/*) ;;
                *) echo "push changed a non-HN path: $path" >&2; exit 1 ;;
              esac
            done <<< "$paths"
          else
            sha="$(git rev-parse HEAD)"
          fi
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$main_sha" != "$sha" ]]; then
            echo "target is superseded by current main: target=$sha main=$main_sha"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha"

      - name: Install deploy SSH identity
        if: steps.target.outputs.superseded != 'true'
        env:
          DEPLOY_KEY: ${{ secrets.DROSE_SITE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROSE_SITE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/drose-site-deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/drose-site-deploy" "$HOME/.ssh/known_hosts"

      - name: Deploy exact commit to Clifford
        if: steps.target.outputs.superseded != 'true'
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/drose-site-deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            drose@5.161.97.53 "deploy $SHA"

      - name: Install Bun
        if: steps.target.outputs.superseded != 'true'
        uses: oven-sh/setup-bun@v2

      - name: Verify public deployment
        if: steps.target.outputs.superseded != 'true'
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run scripts/smoke.ts https://drose.io
