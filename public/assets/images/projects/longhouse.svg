<svg viewBox="0 0 640 360" width="640" height="360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Longhouse multi-machine coding agent remote control">
  <rect width="640" height="360" rx="6" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="639" height="359" rx="6" fill="none" stroke="#30363d"/>

  <!-- Big, legible header (readable at 255px wide!) -->
  <circle cx="32" cy="36" r="9" fill="#3fb950"/>
  <text x="52" y="45" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#e6edf3">Longhouse</text>
  <rect x="444" y="18" width="174" height="36" rx="18" fill="#132a1d" stroke="#3fb950" stroke-width="1.8"/>
  <text x="531" y="42" text-anchor="middle" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#56d364">3 AGENTS LIVE</text>

  <!-- Row 1: Huge readable row -->
  <rect x="22" y="78" width="596" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="48" cy="119" r="7" fill="#3fb950"/>
  <text x="70" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff">Claude Code</text>
  <rect x="412" y="96" width="188" height="46" rx="8" fill="#15283d" stroke="#58a6ff" stroke-width="2"/>
  <text x="506" y="126" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#79c0ff">Live control</text>

  <!-- Row 2: Huge readable row -->
  <rect x="22" y="176" width="596" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="48" cy="217" r="7" fill="#39c5cf"/>
  <text x="70" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff">Codex · Cursor</text>
  <rect x="412" y="194" width="188" height="46" rx="8" fill="#15283d" stroke="#58a6ff" stroke-width="2"/>
  <text x="506" y="224" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#79c0ff">Live control</text>

  <!-- Bottom Remote Steer Bar -->
  <rect x="22" y="276" width="596" height="62" rx="10" fill="#121820" stroke="#58a6ff" stroke-width="2"/>
  <text x="42" y="316" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="22" font-weight="600" fill="#e6edf3">&gt; Steer running CLI...</text>
  <rect x="492" y="286" width="114" height="42" rx="7" fill="#58a6ff"/>
  <text x="549" y="315" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#0d1117">Send</text>
</svg>
