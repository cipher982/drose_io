<svg viewBox="0 0 640 286" width="640" height="286" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="2011 Mercedes G55 AMG as-built hardware schematic">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .frame { fill: none; stroke: #21262d; }
      .grid-line { fill: none; stroke: #21262d; stroke-width: 0.5; opacity: 0.5; }
      .fg { fill: #e6edf3; }
      .muted { fill: #9ca6b0; }
      .accent { fill: #58a6ff; }
      .orange { fill: #f0883e; }
      .cyan { fill: #39c5cf; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .tag-bg { fill: #161b22; stroke-width: 1.4; }
      .leader { fill: none; stroke-width: 1.6; stroke-dasharray: 3 3; opacity: 0.85; }

      .tf { fill: none; stroke: #8b949e; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
      .tf .ground { stroke: #30363d; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .tf .body { fill: #161b22; stroke: #e6edf3; stroke-width: 2.6; }
      .tf .glass { fill: rgba(88, 166, 255, 0.12); stroke: #8b949e; stroke-width: 1.7; }
      .tf .tire { fill: #0d1117; stroke: #e6edf3; stroke-width: 2.6; }
      .tg .dc { fill: rgba(240, 136, 62, 0.16); stroke: #f0883e; stroke-width: 2; }
      .tg .bus { fill: none; stroke: #39c5cf; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .tg .bus-b { fill: none; stroke: #76d7df; stroke-dasharray: 6 4; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .part .dc { fill: #f0883e; stroke: #0d1117; stroke-width: 1.5; }
      .ta .dp { fill: #58a6ff; stroke: #0d1117; stroke-width: 1.5; }
      .ta .de { fill: #39c5cf; stroke: #0d1117; stroke-width: 1.5; }
      .ta .wire-dp { fill: none; stroke: #58a6ff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .ta .wire-de { fill: none; stroke: #39c5cf; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

      
    </style>
    <pattern id="bp-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" class="grid-line"/>
    </pattern>
  </defs>

  <rect width="640" height="286" rx="6" class="bg"/>
  <rect width="640" height="286" rx="6" fill="url(#bp-grid)"/>
  <rect x="0.5" y="0.5" width="639" height="285" rx="6" class="frame"/>

  <!-- Bold, readable header -->
  <text x="16" y="27" font-size="16" font-weight="700" class="sans fg">2011 G55 AMG (W463)</text>
  <text x="624" y="27" text-anchor="end" font-size="13.5" font-weight="700" class="mono accent">N16 20 Hz · ME 2.8.1 50 Hz CAN</text>

  <!-- Truck cutaway scaled cleanly with tight vertical margins -->
  <g transform="translate(88, 36) scale(0.49)">
    <g class="tf">
      <line class="ground" x1="-30" y1="412" x2="990" y2="412"/>
      <path class="body" d="M52 296 L52 184 L60 178 L334 170 L354 42 L362 34 L886 34 L896 44 L898 296 L864.7 296 A100 100 0 0 0 675.3 296 L299.7 296 A100 100 0 0 0 110.3 296 Z"/>
      <path d="M310 300 A110 110 0 0 0 100 300 M875 300 A110 110 0 0 0 665 300"/>
      <path class="glass" d="M368 54 L500 54 L500 162 L352 162 Z M516 54 L640 54 L640 162 L516 162 Z M660 54 L882 54 L882 162 L660 162 Z"/>
      <path d="M338 172 L896 172 M358 46 L892 46 M60 178 L60 296 M508 44 L508 294 M650 44 L650 294 M342 172 L342 294 M300 232 L890 232"/>
      <path d="M346 142 L322 137 L320 160 L346 160 Z"/>
      <rect x="74" y="164" width="24" height="10" rx="3"/>
      <rect x="30" y="266" width="32" height="32" rx="4"/>
      <rect x="890" y="270" width="24" height="28" rx="4"/>
      <rect x="898" y="112" width="48" height="156" rx="20"/><path d="M922 116 L922 264"/>
      <rect x="312" y="300" width="318" height="8" rx="3"/>
      <circle class="tire" cx="205" cy="328" r="84"/><circle cx="205" cy="328" r="52"/><circle cx="205" cy="328" r="12"/>
      <circle class="tire" cx="770" cy="328" r="84"/><circle cx="770" cy="328" r="52"/><circle cx="770" cy="328" r="12"/>
    </g>
    <g class="tg">
      <rect class="dc" x="92" y="190" width="186" height="80" rx="10"/>
      <rect class="dc" x="290" y="252" width="150" height="34" rx="8"/>
      <path class="dc" d="M122 262 L180 284"/>
      <path class="bus" d="M266 222 L266 292 L712 292 L712 216 M393 186 L393 292 M417 278 L417 292"/>
      <path class="bus-b" d="M352 196 L352 282 L724 282 L724 216"/>
    </g>
    <g class="part">
      <rect class="dc" x="250" y="200" width="32" height="22" rx="3"/>
      <rect class="dc" x="402" y="256" width="30" height="22" rx="3"/>
      <rect class="dc" x="384" y="178" width="18" height="8" rx="2"/>
      <rect class="dc" x="108" y="270" width="22" height="18" rx="3"/>
    </g>
    <g class="ta">
      <rect class="dp" x="370" y="56" width="26" height="14" rx="3"/>
      <rect class="de" x="372" y="138" width="26" height="20" rx="2"/>
      <rect class="de" x="700" y="196" width="34" height="20" rx="3"/>
      <rect class="dp" x="744" y="186" width="50" height="30" rx="3"/>
      <rect class="de" x="808" y="180" width="56" height="44" rx="3"/>
      <path class="wire-dp" d="M396 63 L769 63 L769 186"/>
      <path class="wire-de" d="M734 206 L744 206"/>
      <path class="wire-de" d="M398 148 L430 148 L430 206 L700 206"/>
      <path class="wire-de" d="M808 202 L794 202"/>
    </g>
  </g>

  <!-- Direct component callout badges (big, legible at 396px!) -->
  <!-- 1. Cameras (left-top) -->
  <line x1="214" y1="67" x2="269" y2="67" class="leader" stroke="#58a6ff"/>
  <rect x="16" y="52" width="198" height="26" rx="5" class="tag-bg" stroke="#58a6ff"/>
  <text x="115" y="69" text-anchor="middle" font-size="13" font-weight="700" class="mono accent">Dual Cameras (20 fps)</text>

  <!-- 2. ME 2.8.1 ECU (left-mid) -->
  <line x1="176" y1="106" x2="218" y2="138" class="leader" stroke="#f0883e"/>
  <rect x="16" y="92" width="160" height="26" rx="5" class="tag-bg" stroke="#f0883e"/>
  <text x="96" y="109" text-anchor="middle" font-size="13" font-weight="700" class="mono orange">Patched ECU</text>

  <!-- 3. NAG52 TCU (bottom-center) -->
  <line x1="292" y1="172" x2="292" y2="250" class="leader" stroke="#f0883e"/>
  <rect x="206" y="250" width="174" height="26" rx="5" class="tag-bg" stroke="#f0883e"/>
  <text x="293" y="267" text-anchor="middle" font-size="13" font-weight="700" class="mono orange">NAG52 TCU · CAN</text>

  <!-- 4. Jetson Orin NX + Pi 5 + LiFePO4 (bottom-right) -->
  <line x1="466" y1="142" x2="532" y2="250" class="leader" stroke="#58a6ff"/>
  <rect x="394" y="250" width="230" height="26" rx="5" class="tag-bg" stroke="#39c5cf"/>
  <text x="509" y="267" text-anchor="middle" font-size="13" font-weight="700" class="mono cyan">Jetson + Pi 5 + 4 kWh</text>
</svg>
